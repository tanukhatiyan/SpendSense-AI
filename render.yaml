# Render Blueprint Specification for SpendSense AI
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Dockerized FastAPI Application)
  # ----------------------------------------------------------------------------
  - type: web
    name: spendsense-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free # Free tier: spins down after 15m inactivity; upgrade to Starter ($7/mo) for zero spin-down
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: spendsense-db
          property: connectionString # Connects via Render private network
      - key: SECRET_KEY
        generateValue: true # Render automatically generates a cryptographically secure 256-bit secret
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        # Set to "*" for initial provisioning. Once your frontend is live, 
        # update this to your exact frontend domain (e.g. https://spendsense-frontend.onrender.com)
        value: "*"
      - key: AI_PROVIDER
        value: mock # Offline deterministic mode by default; change to 'gemini', 'openai', or 'groq' when key is provided
      - key: GEMINI_API_KEY
        sync: false # Set securely in Render Dashboard (never committed to Git)
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite Production Build)
  # ----------------------------------------------------------------------------
  - type: web
    name: spendsense-frontend
    runtime: static
    rootDir: frontend/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: spendsense-backend
          property: host # Dynamically injects backend host at build time
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: spendsense-db
    databaseName: spendsensedb
    user: spendsense_user
    plan: free # Free tier available for 30 days
