# Render Blueprint Specification for SpendSense AI (Nested SpendSense-AI Root)
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Dockerized FastAPI Application)
  # ----------------------------------------------------------------------------
  - type: web
    name: spendsense-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: spendsense-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: CORS_ORIGINS
        value: "*"
      - key: AI_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite Production Build)
  # ----------------------------------------------------------------------------
  - type: web
    name: spendsense-frontend
    runtime: static
    rootDir: frontend/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_BASE_URL
        value: ""
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: spendsense-db
    databaseName: spendsensedb
    user: spendsense_user
    plan: free
